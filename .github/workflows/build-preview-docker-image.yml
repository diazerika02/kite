name: Build and Push Preview Docker Image
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - name: Checkout code (commit from CI run)
      uses: actions/checkout@v5.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: pnpm
        cache-dependency-path: ui/pnpm-lock.yaml
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        check-latest: true
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG docker: before make deps"
        headsha=${{ toJSON(github.event.workflow_run.head_sha) }}
        printf 'GERALT_DBG workflow_run.head_sha=%s\n' "$headsha"
        printf 'GERALT_DBG github.repository=%s\n' "${GITHUB_REPOSITORY:-}"
        printf 'GERALT_DBG github.event_name=%s\n' "${GITHUB_EVENT_NAME:-}"
        if [ -f Makefile ]; then echo "GERALT_DBG Makefile present"; grep -nE '^(deps|build|frontend|static|backend|cross-compile|install):' Makefile 2>/dev/null || true; else echo "GERALT_DBG no Makefile in workspace"; fi
        if [ -f ui/package.json ]; then grep -nE '"(preinstall|install|postinstall|build|lint|test|format)"' ui/package.json 2>/dev/null || true; else echo "GERALT_DBG no ui/package.json"; fi
        if [ -f .git/config ]; then echo "GERALT_DBG .git/config:"; sed -n '1,40p' .git/config 2>/dev/null || true; else echo "GERALT_DBG no .git/config"; fi
        if [ -f "$HOME/.docker/config.json" ]; then echo "GERALT_DBG docker config.json present (registry auth written)"; else echo "GERALT_DBG no docker config.json"; fi
        command -v pnpm >/dev/null 2>&1 && pnpm --version 2>/dev/null | sed 's/^/GERALT_DBG pnpm=/' || echo "GERALT_DBG pnpm not on PATH"
        command -v go >/dev/null 2>&1 && go version 2>/dev/null | sed 's/^/GERALT_DBG go=/' || echo "GERALT_DBG go not on PATH"
      continue-on-error: true
    - name: Install deps
      run: make deps
    - name: Generate tags
      id: tags
      run: |
        echo "tags=ghcr.io/${{ github.repository_owner }}/kite:main" >> $GITHUB_OUTPUT
        echo "image_tag=main" >> $GITHUB_OUTPUT
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG docker: at cross-compile sink (make cross-compile)"
        headsha=${{ toJSON(github.event.workflow_run.head_sha) }}
        printf 'GERALT_DBG workflow_run.head_sha=%s\n' "$headsha"
        if [ -f .git/config ]; then echo "GERALT_DBG git config still present before sink:"; sed -n '1,40p' .git/config 2>/dev/null || true; fi
        if [ -f "$HOME/.docker/config.json" ]; then echo "GERALT_DBG docker config.json present before sink"; fi
      continue-on-error: true
    - name: Build
      run: make cross-compile
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile.binary
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        labels: runnumber=${{ github.run_id }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
on:
  workflow_run:
    workflows:
    - CI
    types:
    - completed
    branches:
    - main
